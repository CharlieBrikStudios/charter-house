<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Charter House · Stockport in 360°">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,400;125,500;125,600&family=Besley:ital,wght@0,400;0,500;1,400&family=Familjen+Grotesk:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --night: #0e0c0b;
  --glass: rgba(20, 16, 14, 0.58);
  --glass-hi: rgba(24, 19, 16, 0.86);
  --line: rgba(243, 230, 210, 0.15);
  --line-hi: rgba(243, 230, 210, 0.34);
  --ink: #f5eee4;
  --ink-2: rgba(245, 238, 228, 0.74);
  --ink-3: rgba(245, 238, 228, 0.5);
  --brass: #d8b476;
  --brass-hi: #ecd3a2;
  --brick: #c66b43;
  --f-display: "Besley", "Iowan Old Style", Georgia, serif;
  --f-body: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-label: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --r: 16px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(14px, env(safe-area-inset-top, 0px));
  --gb: max(14px, env(safe-area-inset-bottom, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font: 15px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
body { touch-action: none; user-select: none; -webkit-user-select: none; }
#stage { position: fixed; inset: 0; cursor: grab; }
#stage.drag { cursor: grabbing; }
canvas { display: block; }
#fade { position: fixed; inset: 0; background: var(--night); opacity: 1; pointer-events: none; transition: opacity .55s ease; z-index: 5; }
.glass { background: var(--glass); backdrop-filter: blur(18px) saturate(1.25); -webkit-backdrop-filter: blur(18px) saturate(1.25); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 40px rgba(0,0,0,.28); }
.label { font: 500 10.5px/1.2 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- header */
#head { position: fixed; top: var(--gt); left: var(--gl); z-index: 10; display: flex; align-items: center; gap: 14px; pointer-events: none; }
#backApp { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 10px; border-radius: 11px; color: var(--ink); text-decoration: none; font: 600 11px/1 var(--f-label); letter-spacing: .1em; text-transform: uppercase; }
#backApp:hover { border-color: var(--brass); }
#head img { height: 22px; opacity: .92; }
#head .sep { width: 1px; height: 22px; background: var(--line-hi); }
#head .where { font: 500 11px/1 var(--f-label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- toolbar */
#tools { position: fixed; top: var(--gt); right: var(--gr); z-index: 10; display: flex; gap: 8px; }
#tools button { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; }
#tools button[aria-pressed="true"] { border-color: var(--brass); color: var(--brass-hi); }
#tools svg { width: 19px; height: 19px; }

/* ---------- story panel */
#panel { position: fixed; z-index: 9; left: var(--gl); top: calc(var(--gt) + 54px); width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - var(--gt) - 50px - 132px - var(--gb)); overflow: auto; padding: 20px 20px 18px; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s; scrollbar-width: thin; }
#panel.hide { transform: translateX(calc(-100% - 30px)); opacity: 0; pointer-events: none; }
#panel h1 { font: 500 30px/1.08 var(--f-display); margin: 8px 0 10px; letter-spacing: -.01em; text-wrap: balance; }
#panel .lede { color: var(--ink-2); margin: 0 0 16px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.stats div { background: rgba(14,11,10,.55); padding: 11px 12px 10px; min-width: 0; }
.stats b { display: block; font: 500 24px/1.05 var(--f-display); color: var(--brass-hi); letter-spacing: -.01em; }
.stats span { display: block; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); margin-top: 3px; }
.stats .wide { grid-column: span 2; }
.big { display: flex; align-items: baseline; gap: 12px; margin: 2px 0 14px; flex-wrap: wrap; }
.big b { font: 500 50px/1 var(--f-display); color: var(--brass-hi); letter-spacing: -.02em; }
.big i { font: 400 italic 20px/1 var(--f-display); color: var(--ink-3); }
.big em { font-style: normal; font: 500 50px/1 var(--f-display); color: var(--ink); letter-spacing: -.02em; }
.big small { flex-basis: 100%; font-size: 13px; color: var(--ink-2); }
.timeline { list-style: none; margin: 4px 0 2px; padding: 0 0 0 14px; border-left: 1px solid var(--line-hi); }
.timeline li { position: relative; padding: 0 0 10px 6px; font-size: 13px; color: var(--ink-2); }
.timeline li::before { content: ""; position: absolute; left: -18.5px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--night); border: 1.5px solid var(--brass); }
.timeline li.future::before { background: var(--brass); }
.timeline b { color: var(--ink); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
.src { font-size: 11px; color: var(--ink-3); margin: 12px 0 0; }
#panelToggle { position: fixed; z-index: 10; left: var(--gl); top: calc(var(--gt) + 50px); height: 36px; padding: 0 14px 0 10px; border-radius: 10px; display: none; align-items: center; gap: 8px; font: 500 11px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
#panelToggle.show { display: inline-flex; }
#panel .close { position: absolute; right: 10px; top: 10px; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
#panel .close:hover { color: var(--ink); background: rgba(255,255,255,.06); }

/* ---------- hotspots */
#spots { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
#spots.off { display: none; }
.spot { position: absolute; left: 0; top: 0; pointer-events: auto; transform: translate(-50%, -50%); will-change: transform; }
.spot.go { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.spot.go .ring { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(18,14,12,.55); border: 1.5px solid var(--brass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 0 0 0 rgba(216,180,118,.5); animation: pulse 2.4s infinite; transition: transform .2s; }
.spot.go:hover .ring { transform: scale(1.08); background: rgba(216,180,118,.22); }
.spot.go svg { width: 20px; height: 20px; color: var(--brass-hi); }
.spot.go .tx { font: 600 11px/1.2 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.8), 0 0 2px rgba(0,0,0,.9); white-space: nowrap; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(216,180,118,.45); } 70% { box-shadow: 0 0 0 16px rgba(216,180,118,0); } 100% { box-shadow: 0 0 0 0 rgba(216,180,118,0); } }
.spot.info { transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; }
.spot.info .chip { display: flex; align-items: center; gap: 8px; padding: 6px 11px 6px 8px; border-radius: 999px; background: rgba(18,14,12,.72); border: 1px solid var(--line-hi); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; transition: border-color .2s, background .2s; }
.spot.info .chip:hover { border-color: var(--brass); background: rgba(30,24,20,.9); }
.spot.info .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--brass); display: grid; place-items: center; font: 600 10px/1 var(--f-label); color: var(--brass-hi); flex: none; }
.spot.info .t { font: 500 13px/1.1 var(--f-body); color: var(--ink); }
.spot.info .t small { display: block; font: 500 9.5px/1.2 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); margin-top: 2px; }
.spot .stem { width: 1px; height: calc(26px + var(--lift, 0px)); background: linear-gradient(var(--line-hi), rgba(255,255,255,.75)); }
.spot .foot { width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(216,180,118,.45); margin-top: -1px; }
.spot.dev { transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; }
.spot.dev .card { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 14px; background: rgba(24,19,16,.86); border: 1.5px solid var(--brass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 26px rgba(0,0,0,.35); transition: transform .2s; }
.spot.dev:hover .card { transform: translateY(-2px); }
.spot.dev .card img { width: 46px; height: 46px; object-fit: cover; border-radius: 9px; }
.spot.dev .card b { display: block; font: 500 16px/1.1 var(--f-display); }
.spot.dev .card span { display: block; font: 500 9.5px/1.3 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); margin-top: 3px; }
.spot.dev .stem { height: calc(34px + var(--lift, 0px)); background: linear-gradient(var(--brass), #fff); }
.spot.behind { display: none; }

/* ---------- info card */
#card { position: fixed; z-index: 12; right: var(--gr); top: calc(var(--gt) + 54px); width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - var(--gt) - 54px - 132px - var(--gb)); overflow: auto; padding: 0; transform: translateX(calc(100% + 30px)); opacity: 0; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s; scrollbar-width: thin; }
#card.open { transform: none; opacity: 1; }
#card .img { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: var(--r) var(--r) 0 0; background: #1a1512; }
#card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
#card .body { padding: 16px 18px 18px; }
#card h2 { font: 500 24px/1.12 var(--f-display); margin: 6px 0 8px; text-wrap: balance; }
#card p { margin: 0 0 10px; color: var(--ink-2); }
#card ul { margin: 0 0 12px; padding: 0; list-style: none; }
#card li { position: relative; padding: 0 0 7px 16px; color: var(--ink-2); font-size: 14px; }
#card li::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
#card .x { position: absolute; z-index: 2; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(14,11,10,.6); color: var(--ink); }
#card .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 11px; font: 600 12px/1 var(--f-label); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; color: #1a140f; background: var(--brass); border: 1px solid var(--brass); }
.btn:hover { background: var(--brass-hi); }
.btn.ghost { color: var(--ink); background: transparent; border-color: var(--line-hi); }
.btn.ghost:hover { border-color: var(--brass); }
.btn.next { width: 100%; justify-content: space-between; margin-top: 16px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; margin: 4px 0 14px; }
.kv div { background: rgba(14,11,10,.5); padding: 9px 10px; min-width: 0; }
.kv b { display: block; font: 500 18px/1.1 var(--f-display); color: var(--brass-hi); }
.kv span { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* ---------- node bar */
#bar { position: fixed; z-index: 10; left: 50%; bottom: var(--gb); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
#bar::-webkit-scrollbar { display: none; }
#bar button { position: relative; flex: none; width: 132px; height: 84px; border-radius: 11px; overflow: hidden; border: 1.5px solid transparent; text-align: left; }
#bar button img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .8; transition: opacity .2s; }
#bar button::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(10,8,7,.85)); }
#bar button span { position: absolute; z-index: 1; left: 9px; right: 8px; bottom: 7px; font: 600 10px/1.2 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: #fff; }
#bar button em { position: absolute; z-index: 1; left: 9px; top: 7px; font: 500 italic 13px/1 var(--f-display); color: var(--brass-hi); }
#bar button:hover img { opacity: 1; }
#bar button[aria-current="true"] { border-color: var(--brass); }
#bar button[aria-current="true"] img { opacity: 1; }

/* ---------- minimap */
#map { position: fixed; z-index: 9; right: var(--gr); bottom: var(--gb); width: 220px; height: 220px; padding: 0; overflow: hidden; }
#map canvas { width: 100%; height: 100%; }
#map .label { position: absolute; left: 10px; top: 9px; color: var(--ink-2); font-size: 9.5px; }

/* ---------- loading */
#load { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; background: var(--night); transition: opacity .6s; }
#load.done { opacity: 0; pointer-events: none; }
#load .in { text-align: center; }
#load img { height: 30px; opacity: .9; }
#load .bar { width: 160px; height: 2px; background: var(--line); margin: 18px auto 0; overflow: hidden; border-radius: 2px; }
#load .bar i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .3s; }
#hint { position: fixed; z-index: 8; left: 50%; bottom: calc(var(--gb) + 110px); transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; font-size: 13px; color: var(--ink-2); transition: opacity .6s; white-space: nowrap; }
#hint.gone { opacity: 0; pointer-events: none; }
#roomBar { position: fixed; z-index: 11; left: 50%; top: calc(var(--gt) + 2px); transform: translateX(-50%); display: none; gap: 6px; padding: 5px; }
#roomBar.show { display: flex; }
#roomBar button { height: 34px; padding: 0 14px; border-radius: 9px; font: 600 10.5px/1 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
#roomBar button[aria-current="true"] { background: var(--brass); color: #1a140f; }
#roomBar .back { color: var(--ink); border-right: 1px solid var(--line); border-radius: 9px 0 0 9px; }

@media (max-width: 760px) {
  #map { width: 132px; height: 132px; bottom: calc(var(--gb) + 98px); }
  #panel { top: auto; bottom: calc(var(--gb) + 96px); max-height: 46vh; padding: 16px; }
  #panel h1 { font-size: 24px; }
  .big b, .big em { font-size: 38px; }
  #panelToggle { top: auto; bottom: calc(var(--gb) + 98px); }
  #card { top: auto; bottom: calc(var(--gb) + 96px); right: var(--gr); max-height: 62vh; }
  #bar button { width: 104px; height: 70px; }
  #head .where { display: none; }
  #head img, #head .sep { display: none; }
  #hint { bottom: calc(var(--gb) + 100px); }
  #roomBar { top: calc(var(--gt) + 50px); max-width: calc(100vw - 32px); overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) { .spot.go .ring { animation: none; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }</script>

<body>
<div id="stage"></div>
<div id="spots"></div>
<div id="fade"></div>

<header id="head">
  <a id="backApp" class="glass" href="/charter-house/3d/" title="Back to the Charter House 3D"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg><span>Charter House 3D</span></a>
  <img src="img/brand_brik.png" alt="Brik Studios">
  <span class="sep"></span>
  <span class="where">Stockport · the regeneration in 360°</span>
</header>

<div id="tools">
  <button class="glass" id="tPanel" title="Story panel (P)" aria-label="Show or hide the story panel" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/></svg></button>
  <button class="glass" id="tLabels" title="Labels (L)" aria-label="Show or hide labels" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg></button>
  <button class="glass" id="tSpin" title="Slow pan (Space)" aria-label="Slow pan" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4.5v4h-4"/></svg></button>
  <button class="glass" id="tFull" title="Full screen (F)" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<aside id="panel" class="glass" aria-live="polite"></aside>
<button id="panelToggle" class="glass"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg><span>Story</span></button>
<aside id="card" class="glass" aria-live="polite"></aside>
<div id="roomBar" class="glass"></div>
<nav id="bar" class="glass" aria-label="Tour stops"></nav>
<div id="map" class="glass"><canvas width="440" height="440"></canvas><span class="label">Stockport town centre</span></div>
<div id="hint" class="glass">Drag to look round · click the gold circles to move</div>
<div id="load"><div class="in"><img src="img/brand_brik.png" alt="Brik Studios"><div class="bar"><i></i></div></div></div>

<script type="module" src="tour.js?v=1794220905"></script>
</body>
</html>
